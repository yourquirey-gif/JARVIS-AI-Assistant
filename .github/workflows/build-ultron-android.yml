name: Build ULTRON Android App
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "capacitor.config.json"
      - "vite.config.js"
      - ".github/workflows/build-ultron-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ultron-android-publish
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Build ULTRON mobile interface
        env:
          VITE_JARVIS_CLOUD_API_URL: https://jarvis-cloud-ai-api.onrender.com
        run: npm run build
      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Declare Android runtime permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace('<application', permission + chr(10) + '    <application', 1)
          manifest.write_text(text, encoding='utf-8')
          PY
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publish APK to the Vercel website origin
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/ULTRON-Android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ULTRON-Android.apk
          git commit -m "chore: publish ULTRON Android APK for Vercel"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if [ $? -ne 0 ]; then
              git rebase --abort || true
              echo "Could not rebase APK publish commit onto main."
              exit 1
            fi
            git push origin HEAD:main && exit 0
            sleep 3
          done
          echo "Could not push APK after five retries."
          exit 1
