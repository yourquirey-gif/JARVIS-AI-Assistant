name: Build ULTRON Android App
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - "vite.config.js"
      - ".github/workflows/build-ultron-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ultron-android-publish
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Build ULTRON mobile interface
        env:
          VITE_JARVIS_CLOUD_API_URL: https://jarvis-cloud-ai-api.onrender.com
        run: npm run build
      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Declare Android runtime permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace('<application', permission + chr(10) + '    <application', 1)
          if '<queries>' not in text:
              queries = '''    <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.google.android.youtube" />
                  <package android:name="com.android.chrome" />
                  <package android:name="com.google.android.gm" />
                  <package android:name="com.google.android.apps.maps" />
                  <package android:name="com.google.android.dialer" />
                  <package android:name="com.samsung.android.dialer" />
                  <package android:name="com.google.android.apps.messaging" />
                  <package android:name="com.samsung.android.messaging" />
                  <package android:name="com.google.android.calculator" />
                  <package android:name="com.sec.android.app.popupcalculator" />
                  <package android:name="com.android.vending" />
                  <package android:name="com.android.settings" />
              </queries>'''
              text = text.replace('<application', queries + chr(10) + '    <application', 1)
          manifest.write_text(text, encoding='utf-8')
          PY
      - name: Set Android package version
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          major, minor, patch = (int(part) for part in version.split("."))
          version_code = major * 1000000 + minor * 1000 + patch
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text(encoding="utf-8")
          source, code_count = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", source, count=1)
          source, name_count = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version}"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not find Android versionCode/versionName in app/build.gradle.")
          gradle.write_text(source, encoding="utf-8")
          print(f"Android package version: {version} (versionCode {version_code})")
          PY
      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publish APK to the Vercel website origin
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          APK_ARTIFACT="$RUNNER_TEMP/ULTRON-Android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_ARTIFACT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p public/downloads public/app-updates
            cp "$APK_ARTIFACT" public/downloads/ULTRON-Android.apk
            python - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          manifest_path = Path("public/app-updates/android.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["version"] = package["version"]
          manifest["releaseNotes"] = "Android 1.0.2: native voice assistant, selected-app quick launch, Glass Wave Blob and permission controls. Android confirms installation."
          manifest_path.write_text(json.dumps(manifest, indent=2) + chr(10), encoding="utf-8")
          PY
            git add public/downloads/ULTRON-Android.apk public/app-updates/android.json
            if git diff --cached --quiet; then
              echo "Android package and manifest already match this build."
              exit 0
            fi
            git commit -m "chore: publish ULTRON Android APK for Vercel"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "Could not publish Android APK after five attempts."
          exit 1
