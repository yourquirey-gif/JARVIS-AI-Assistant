name: ULTRON CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r cloud-api/requirements.txt
      - run: python -m compileall -q backend cloud-api
      - name: Verify the Whisper transcription route is registered
        run: python -c "import sys; sys.path.insert(0, 'cloud-api'); from main import app; assert any(route.path == '/api/transcribe' for route in app.routes); print('ULTRON Whisper route is ready.')"
