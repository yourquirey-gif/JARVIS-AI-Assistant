name: Build ULTRON Desktop Companion
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/build-ultron-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
      - name: Install desktop dependencies and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller==5.13.2
      - name: Build Windows desktop companion
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ULTRON-Desktop --paths backend --collect-all uvicorn --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all psutil backend/ultron_desktop.py
      - name: Publish installer through the Vercel website origin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "public/downloads" | Out-Null
          Copy-Item "dist/ULTRON-Desktop.exe" "public/downloads/ULTRON-Desktop.exe" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/downloads/ULTRON-Desktop.exe"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: publish ULTRON Windows companion for Vercel downloads"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit the ULTRON installer." }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the installer to the main branch." }
          } else {
            Write-Host "The Vercel-hosted installer is already up to date."
          }

          gh release delete-asset ultron-latest ULTRON-Desktop.exe --yes --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No legacy GitHub Release installer asset remained to remove."
          }
