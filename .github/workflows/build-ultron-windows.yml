name: Build ULTRON Windows Desktop App
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "cloud-api/**"
      - "desktop/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/build-ultron-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ultron-installer-publish
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Build ULTRON web interface
        env:
          VITE_JARVIS_CLOUD_API_URL: https://jarvis-ai-assistant-9ra4.onrender.com
        run: npm run build
      - name: Validate Electron and local service syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/pc-service.cjs
          node --check scripts/smoke-test-pc-service.cjs
      - name: Smoke-test native Node PC service
        shell: pwsh
        run: |
          $env:ULTRON_PORT = "18765"
          node scripts/smoke-test-pc-service.cjs
      - name: Package native Windows app
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installer signing status
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "desktop-release/ULTRON-Windows-Setup.exe"
          if ($signature.Status -eq "Valid") {
            Write-Host "Installer is Authenticode-signed by $($signature.SignerCertificate.Subject)."
          } else {
            Write-Warning "Installer is unsigned or does not have a trusted signature. Chrome/SmartScreen reputation warnings may remain until a trusted signing identity and clean download reputation are established."
          }
      - name: Publish installer to the Vercel website origin
        shell: pwsh
        run: |
          $installer = "desktop-release/ULTRON-Windows-Setup.exe"
          if (!(Test-Path $installer)) { throw "Windows installer was not created." }
          $artifactCopy = Join-Path $env:RUNNER_TEMP "ULTRON-Windows-Setup.exe"
          Copy-Item $installer $artifactCopy -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch the latest main branch." }
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw "Could not reset the publish workspace." }
            New-Item -ItemType Directory -Force -Path "public/downloads","public/app-updates" | Out-Null
            Copy-Item $artifactCopy "public/downloads/ULTRON-Windows-Setup.exe" -Force
            if (Test-Path "public/downloads/ULTRON-Desktop.exe") { Remove-Item "public/downloads/ULTRON-Desktop.exe" -Force }
            node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const file='public/app-updates/windows.json'; const manifest=JSON.parse(fs.readFileSync(file,'utf8')); manifest.version=pkg.version; manifest.releaseNotes='Windows 1.3.1: amplified ULTRON AI voice output using Windows native speech synthesis with loudness processing, alongside app control and Dictate Anywhere. App uninstall and file deletion remain protected.'; fs.writeFileSync(file,JSON.stringify(manifest,null,2)+String.fromCharCode(10),'utf8');"
            if ($LASTEXITCODE -ne 0) { throw "Could not update the Windows release manifest." }
            git add -A public/downloads/ public/app-updates/windows.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) { Write-Host "Windows package and manifest already match this build."; exit 0 }
            git commit -m "chore: publish native ULTRON Windows installer for Vercel"
            if ($LASTEXITCODE -ne 0) { throw "Could not create the Windows publish commit." }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 3
          }
          throw "Could not publish Windows installer after five attempts."
